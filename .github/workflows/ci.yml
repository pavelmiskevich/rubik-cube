name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Audit dependencies
        # Исключений нет: уязвимые транзитивные зависимости CLI-пакета prisma
        # (deepmerge-ts, mysql2) подняты до исправленных версий через
        # "overrides" в package.json — см. пункт 3 TECHDEBT.md.
        # audit-ci сравнивает уровень каждого адвизори, а npm audit печатает
        # уровень пакета — худший из его адвизори. Без исключений обе проверки
        # падают в одних и тех же случаях.
        run: npx audit-ci --high

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test
        run: |
          cp .env.ci .env
          docker compose up -d --build
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3030/ || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
