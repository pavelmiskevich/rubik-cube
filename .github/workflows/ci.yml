name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Audit dependencies
        # Все три адвизори приходят транзитивно через CLI-пакет prisma
        # (dev-зависимость) и не попадают в рантайм приложения:
        #   GHSA-ggr8-5vv4-36mx  — deepmerge-ts в @prisma/config;
        #   GHSA-3f6p-5ww8-9rcr  — mysql2, драйвер MySQL.
        # Проект работает на postgresql через @prisma/adapter-pg, mysql2 не загружается.
        # Снять, когда Prisma обновит свои зависимости.
        run: >-
          npx audit-ci --high
          --allowlist GHSA-ggr8-5vv4-36mx GHSA-3f6p-5ww8-9rcr

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Smoke test
        run: |
          cp .env.ci .env
          docker compose up -d --build
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3030/ || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
