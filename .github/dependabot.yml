# Обновления зависимостей (#119). Раз в неделю, мелкие обновления — одним PR
# на экосистему, чтобы не тонуть в PR: при защите main с требованием актуальной
# ветки каждый открытый PR после вливания соседнего становится BEHIND и требует
# `gh pr update-branch`.
#
# Исправления безопасности приходят отдельно и сразу, если они включены в
# настройках репозитория; их тоже собираем в один PR на экосистему.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Мажорные версии npm плановым PR не предлагаются (решение владельца,
      # 26.11.2026): первые же — TypeScript 7, Tailwind 4, Cypress 16 — пришли
      # с красными проверками, а переход на них — отдельная задача с
      # миграцией. Сюда же мажорная версия Node (@types/node) — она меняется
      # вместе с .nvmrc и образом (#118). Если исправление уязвимости найдётся
      # только в мажорной версии, об этом скажет красный workflow Audit.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    ignore:
      # Мажорная версия Node — вместе с .nvmrc, CI и engines (#118).
      - dependency-name: node
        update-types: [version-update:semver-major]
