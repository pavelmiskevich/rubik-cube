name: Uptime

# Слежение за доступностью прода снаружи (#120): 13 ноября 2026 сайт не
# отвечал, и узнали об этом случайно. Проверяются `/`, `/api/health` (200
# только при живой базе) и срок сертификата — скрипт deploy/uptime-check.
#
# Упавший запуск — письмо владельцу от GitHub. Что делать — deploy/README.md,
# «Слежение за доступностью».
#
# Расписание GitHub частые запуски режет: из четырёх в час на деле выходит
# один раз в 8–11 часов (23–26 ноября 2026). Это сигнал «сайт лежит полдня»,
# а не мониторинг. После 60 дней без активности в репозитории расписание
# отключается — как у Backup.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Медленный запуск не должен копиться очередью за следующим.
concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    # Выключатель, как DEPLOY_ENABLED у выкладки: без выложенного сайта
    # проверять нечего.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/uptime-check
          sparse-checkout-cone-mode: false
      - name: Check site
        run: bash deploy/uptime-check https://rubik-cube.miskevich.ru
