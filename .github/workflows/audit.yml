name: Audit

# Уязвимости зависимостей — каждый день, а не только на PR (#119). Без этого
# прод мог стоять с известной уязвимостью, пока кто-нибудь не откроет PR:
# критическая уязвимость фреймворка так и нашлась — случайно, на постороннем
# PR (#111).
#
# Упавший запуск — письмо владельцу: появилось адвизори уровня high или
# выше. Что делать — в STATE.md, «Открытые задачи»: по каждому high проверить,
# есть ли исправленная версия, и поднимать через "overrides", без исключений
# в audit-ci.
#
# Проверка для PR — job `audit` в ci.yml; здесь та же команда.
#
# Расписание GitHub неточное (задержки до десятков минут) и отключается после
# 60 дней без активности в репозитории — как у workflow Backup.
on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Audit dependencies
        run: npx audit-ci --high
